name: Reparo CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend Test Suite (Laravel 12 / PHP 8.4)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl, zip, sqlite3
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare Environment & Database
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate:fresh --seed --force

      - name: Run Backend Feature & Unit Tests
        run: php artisan test

  frontend-test:
    name: Frontend Test & Web Build (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            frontend/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Widget Tests
        run: flutter test

      - name: Build Flutter Web Bundle (Release)
        run: flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reparo-web-build
          path: frontend/build/web
          retention-days: 7

  docker-verification:
    name: Docker & Nginx Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Validate Reverse Proxy Nginx Configuration Syntax
        run: |
          docker run --rm -v ${{ github.workspace }}/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf --entrypoint nginx nginx:alpine -t

      - name: Validate Frontend Nginx Configuration Syntax
        run: |
          docker run --rm -v ${{ github.workspace }}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf --entrypoint nginx nginx:alpine -t

  publish-ghcr:
    name: Build & Push Images to GHCR
    needs: [backend-test, frontend-test, docker-verification]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Repository Name (Lowercase)
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/reparo-backend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/reparo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/reparo-frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/reparo-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
