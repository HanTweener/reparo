services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reparo-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      APP_NAME: "Reparo"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://reparobe.mfarhanf.dpdns.org"
      SANCTUM_STATEFUL_DOMAINS: "reparov1.mfarhanf.dpdns.org,localhost"
      SESSION_DOMAIN: ".mfarhanf.dpdns.org"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SEED_DEMO_DATA: "true"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:-SB-Mid-server-4rP7_EIlu__KgUjUCWOcEG07}"
      MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY:-Mid-client-Ksb_eTW3btWxzvJJ}"
      MIDTRANS_IS_PRODUCTION: "false"
    volumes:
      - backend-storage:/var/www/html/storage
      - backend-database:/var/www/html/database
    networks:
      - reparo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reparo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - reparo-network

  tunnel-frontend:
    image: cloudflare/cloudflared:latest
    container_name: reparo-tunnel-frontend
    restart: unless-stopped
    command: tunnel run --token eyJhIjoiODk1NjgzNTUxMTEyOTNmNTg3MzAxOTVhYjQ4OTRhNWEiLCJ0IjoiOWQ5YzgyZjItOGI2Ny00ZGJjLTlkYzItMDYxMmIzMTE0OTQwIiwicyI6IlpUQXpPR1ZrWXpjdE1tVmtaQzAwWlRjMExUazJORFl0T1dVMk1EVXpZVEZqTmpGaCJ9
    depends_on:
      - frontend
    networks:
      - reparo-network

  tunnel-backend:
    image: cloudflare/cloudflared:latest
    container_name: reparo-tunnel-backend
    restart: unless-stopped
    command: tunnel run --token eyJhIjoiODk1NjgzNTUxMTEyOTNmNTg3MzAxOTVhYjQ4OTRhNWEiLCJ0IjoiYjU5NWRkMjQtMTY5Yy00OWFjLWJkMTYtODM1Yjc2OWE4MjM5IiwicyI6Ik5XVmlPV0V4TWpZdFpURXhaaTAwTkRNeUxXRTVabVV0WlRrM1lUZGpPVFpqTW1FdyJ9
    depends_on:
      - backend
    networks:
      - reparo-network

networks:
  reparo-network:
    driver: bridge

volumes:
  backend-storage:
  backend-database:

