version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reparo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Reparo"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SEED_DEMO_DATA: "true"
      MIDTRANS_SERVER_KEY: "SB-Mid-server-test-secret-key-reparo"
      MIDTRANS_IS_PRODUCTION: "false"
    volumes:
      - backend-storage:/var/www/html/storage
      - backend-database:/var/www/html/database
    networks:
      - reparo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reparo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - reparo-network

networks:
  reparo-network:
    driver: bridge

volumes:
  backend-storage:
  backend-database:
