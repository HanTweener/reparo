services:
  backend:
    image: ghcr.io/hantweener/reparo-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reparo-backend
    restart: unless-stopped
    #ports:
    #  - "${BACKEND_PORT:-8001}:8000"
    environment:
      APP_NAME: "${APP_NAME:-Reparo}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8001}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:-}"
      MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY:-}"
      MIDTRANS_IS_PRODUCTION: "${MIDTRANS_IS_PRODUCTION:-false}"
      MIDTRANS_WEBHOOK_URL: "${MIDTRANS_WEBHOOK_URL:-}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:80}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      CORS_ALLOWED_ORIGINS_PATTERNS: "${CORS_ALLOWED_ORIGINS_PATTERNS:-}"
    volumes:
      - backend-storage:/var/www/html/storage
      - backend-database:/var/www/html/database
    networks:
      - reparo-network

  frontend:
    image: ghcr.io/hantweener/reparo-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "${API_BASE_URL:-}"
    container_name: reparo-frontend
    restart: unless-stopped
    #ports:
    # - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - reparo-network

  tunnel-frontend:
    image: cloudflare/cloudflared:latest
    container_name: reparo-tunnel-frontend
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_FRONTEND_TOKEN:-}
    depends_on:
      - frontend
    networks:
      - reparo-network

  tunnel-backend:
    image: cloudflare/cloudflared:latest
    container_name: reparo-tunnel-backend
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_BACKEND_TOKEN:-}
    depends_on:
      - backend
    networks:
      - reparo-network

networks:
  reparo-network:
    driver: bridge

volumes:
  backend-storage:
  backend-database:
